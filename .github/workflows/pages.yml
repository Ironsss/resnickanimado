name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy pytest
      - run: python -m pytest -q

  render:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libcairo2-dev libpango1.0-dev pkg-config \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended dvisvgm \
            fonts-inter fonts-jetbrains-mono
          fc-cache -f
      - run: pip install -r requirements.txt
      - name: Cache de Manim
        uses: actions/cache@v4
        with:
          path: media
          key: manim-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: manim-${{ matrix.shard }}-
      - name: Renderizar escenas del grupo
        id: render
        continue-on-error: true
        run: python scripts/render_all.py --shard ${{ matrix.shard }}/8
      - name: Avisar de escenas que fallaron
        if: steps.render.outcome == 'failure'
        run: echo "::warning::Fallaron escenas en el grupo ${{ matrix.shard }}; el sitio se publica con las demás (revise el registro del paso anterior)."
      - name: Reunir videos finales
        run: |
          mkdir -p out
          rsync -a --prune-empty-dirs --include='*/' --include='1080p30/*.mp4' --exclude='*' media/videos/ out/
          find out -name '*.mp4' | sort
      - uses: actions/upload-artifact@v4
        with:
          name: videos-${{ matrix.shard }}
          path: out
          if-no-files-found: warn
          retention-days: 2

  build:
    needs: render
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install numpy scipy
      - uses: actions/download-artifact@v4
        with:
          pattern: videos-*
          merge-multiple: true
          path: media/videos
      - name: Construir sitio
        run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
